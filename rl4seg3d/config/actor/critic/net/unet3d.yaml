_target_: patchless_nnunet.models.components.unet.UNet

in_channels: 1
num_classes: 1  # critic outputs a single-channel per-pixel value map (not segmentation classes)
patch_size: [352, 288, 20]
kernels: [[3, 3, 1], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
strides: [[1, 1, 1], [2, 2, 1], [2, 2, 2], [2, 2, 2], [2, 2, 1], [2, 2, 1]]
normalization_layer: "instance"
negative_slope: 1e-2
deep_supervision: True
attention: False
drop_block: False
residual: False
out_seg_bias: False
