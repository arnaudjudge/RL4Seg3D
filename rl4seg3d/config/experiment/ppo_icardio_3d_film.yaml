# @package _global_

# PPO with FiLM view conditioning everywhere (actor, critic, reward).
# Mirrors ppo_icardio_3d but swaps each net for the FiLMUNet variant.
# The additive-ConditionedUNet baseline stays runnable via -e ppo_icardio_3d.

defaults:
  - override /model: ppo_3d
  - override /datamodule: maple
  - override /actor/actor@model.actor.actor: categorical_3d_unet_actor
  - override /actor/actor/net@model.actor.actor.net: film
  - override /actor/critic/net@model.actor.critic.net: film
  - override /reward@model.reward: rewardunets_3d
  # NOTE: the reward-net FiLM swap is applied per-stage in auto_iteration_slurm.py
  # (model/net@model.reward.net=conditioned_unet_film), NOT here. Bundling it in the
  # experiment breaks the baseline predict stage, which swaps the reward to
  # pixelwise_accuracy (no net) -> "Could not override model/net@model.reward.net".
  - override /corrector@model.corrector: ae

datamodule:
  supervised: False

run_name: icardio3d_film
