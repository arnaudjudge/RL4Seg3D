defaults:
  - net: conditioned_unet_film
  # mse = historical behaviour (MSE on post-sigmoid output). A/B against the logit-space
  # losses with `model/loss=bce_logits`; see rewardnet/reward_losses.py.
  - loss: mse

_target_: rl4seg3d.rewardnet.reward_unet_3d.Reward3DOptimizer

save_model_path: ./reward_net_3d.ckpt
# FiLM view conditioning (a2c, a3c, a4c -> 3 views). Must match the datamodule's num_views.
num_views: 3

# ReduceLROnPlateau counts epochs, so retune these if trainer.limit_train_batches changes.
lr: 1e-3
lr_factor: 0.5
lr_patience: 20
lr_min: 1e-6

net:
  # reward net stacks (img, pred) -> 1-channel landmark map
  in_channels: 2
  num_classes: 1
