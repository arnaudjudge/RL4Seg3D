# @package _global_

defaults:
  - model: ppo_3d
  - paths: default
  - extras: default
  # FiLM view-conditioned actor/critic nets (checkpoint trained with view_embed)
  - override /actor/actor/net@model.actor.actor.net: film
  - override /actor/critic/net@model.actor.critic.net: film
  - override hydra/job_logging: custom
  - _self_

task_name: "predict"

tags: ["predict"]

# input folder containing data for inference
input_path: /data/landmarks_dataset_234ch/img/

file_filter_regex: .*

# optional work list naming which cases to predict: either a text file (one case id, filename or
# relative path per line; blank lines and '#' comments ignored) or a csv. Together with
# shard_id/num_shards this replaces splitting a dataset into one file per job by hand.
case_list: null

# csv work lists only: column holding the case ids. Inferred from the usual names when null.
case_list_column: null

# csv work lists only: str.format template over the csv columns giving each case's path
# relative to input_path, e.g. "{dataset}/img/{relative_path}.nii.gz". When set, paths are built
# straight from the csv and the input tree is never scanned -- discovery then costs one stat per
# case actually wanted instead of a full traversal, which matters most because every array task
# would otherwise repeat that traversal. Rows naming a file that is not on disk are skipped and
# counted. Set to null to discover by scanning input_path instead.
#
# Default matches the maple_norm layout: <dataset>/img/<study>/<view>/<id>.nii.gz, where
# `relative_path` already holds <study>/<view>/<id>. Must stay quoted -- unquoted braces are a
# YAML flow mapping. A csv lacking either column now fails immediately, listing the columns it
# does have, rather than silently falling back to a full scan.
case_path_template: "{dataset}/img/{relative_path}.nii.gz"

# csv work lists only: column to prioritise cases by, so that `limit` keeps the cases worth
# having rather than an arbitrary slice. e.g. IQ_expval to take the best image quality first.
# Cases with no value in the column are placed FIRST (an unscored case is not a bad one).
case_order_by: null
# true = highest value first. CONFIRM which end of IQ_expval is "good" for this dataset before
# relying on it: the column runs ~1.5-3.0 alongside IQ_class 1/2/3, and nothing in the code
# interprets it, so the direction is a convention of the labelling, not of the data.
case_order_desc: True

# keep only the first N cases of the (ordered) work list that are NOT already predicted;
# null = all. Applied after the resume check, so with overwrite_existing=False, limit=1 hands
# back the next unpredicted case each time rather than repeatedly offering a finished one.
limit: null

# csv work lists only: pandas query selecting rows before ids are read, e.g.
# "expected_area <= 550000" to keep only the cases that fit a 20GB GPU (the same threshold as
# datamodule/maple.yaml's max_image_area), or "expected_area > 550000" for the rest.
case_list_query: null

# split the resolved work list across `num_shards` processes and handle only `shard_id`'s share.
# The split is round-robin over the sorted list, so cases of uneven size even out across shards.
# On a cluster set shard_id from the array index, e.g. shard_id=$SLURM_ARRAY_TASK_ID.
shard_id: 0
num_shards: 1

# optional path to a {case_identifier: view_str} JSON (e.g. "di-XXXX": "A4C") used to set
# the FiLM view conditioning per case. Leave null to predict unconditioned.
view_mapping: /data/landmarks_dataset_234ch/view_mapping.json

# mirror the input tree inside output_path, so a case read from
# <input_path>/icardio/img/st-X/a4c/di-Y.nii.gz is written to
# <output_path>/icardio/img/st-X/a4c/di-Y.nii.gz instead of flat at the root. Keeps tens of
# thousands of outputs out of one directory (a metadata hot spot on a parallel filesystem, and
# awkward for inode quotas). The per-shard score csv stays at the root either way.
#
# On by default: at ~46k cases (x2 files with save_rewards) a flat output directory is the
# wrong shape. Set False for a flat layout. Switching an in-progress run is safe but leaves a
# mixed tree -- the resume check matches basenames anywhere under output_path, so files already
# written flat still count as done rather than being duplicated. Use a fresh output_path for a
# clean tree.
mirror_input_structure: True

# path components dropped when mirroring: the input tree's "img" level separates images from
# other modalities on the input side and means nothing among predictions, so
# <input>/icardio/img/st-X/a4c/di-Y.nii.gz is written to <output>/icardio/st-X/a4c/di-Y.nii.gz.
# Set to [] to mirror the input path verbatim. Changing this mid-run is safe: claims live in the
# flat csv/ directory, so resume does not depend on where the predictions themselves sit.
mirror_skip_dirs: [img]

# output folder to save predictions
output_path: /data/landmarks_dataset_234ch/pred/random_base_smaller_shift

# passing checkpoint path is necessary for prediction
ckpt_path: /home/local/USHERBROOKE/juda2901/dev/RL4Seg3D/full_ckpt_histo-film-long.ckpt

# whether to use test time augmentation. NOTE the cost: tta_predict runs 25 full
# sliding-window passes per case (1 + 4 contrast + 4x4 translation + 4 rotation), against 1
# without it, so segmentation dominates the reward nets instead of the reverse -- budget roughly
# 7x the per-case time overall and size run_time_min/num_shards accordingly. The rotation branch
# also loops over frames in python twice per angle (it carries its own "optimize this for compute
# time" TODO), so the multiplier is worse on long sequences.
tta: True

# test time optimization: 'force' (always), 'on' (only when the anatomical or temporal metrics
# fail) or 'off'; any other value is treated as 'off'. Requires trainer.inference_mode: False,
# set below.
#
# Cost: a case that fails validity pays ttoptimize (10 optimisation steps) plus a SECOND full
# prediction, which with tta is another 25 sliding-window passes -- so a failing case costs
# roughly twice a passing one. 'force' pays that on every case.
tto: 'on'

# whether to overwrite existing predictions in the output folder. Set False to skip cases whose
# outputs are all present already, which is what makes re-submitting an interrupted job cheap:
# it only redoes what is missing. A case with some but not all of its outputs is always redone.
overwrite_existing: True

save_as_gif: True

# one csv per case, in <output_path>/csv/<case_id>.csv, holding that case's anatomical and
# temporal validity plus per-net and merged reward summaries.
#
# The file doubles as a claim. It is created EMPTY (O_EXCL, so exactly one of any number of
# racing tasks wins the case) before the case runs, and filled only once the mask and reward
# maps are on disk. So:
#   * missing      -> free
#   * empty        -> a task holds it, or died holding it
#   * non-empty    -> done
# That makes concurrent tasks, and whole overlapping submissions, safe without coordinating
# shard assignment, and it makes `overwrite_existing=False` one directory listing rather than a
# walk of the output tree.
#
# There is deliberately no lease: release abandoned (empty) claims when you choose, with
#   find <output_path>/csv -type f -empty -delete
# Aggregate into one table with
#   find <output_path>/csv -name '*.csv' | head -1 | xargs head -1 > all.csv
#   find <output_path>/csv -name '*.csv' -exec tail -n +2 {} + >> all.csv
write_case_csv: True

# also write each case's per-net reward maps as one 4D `_merged_all_rewards.nii.gz`
# (net axis first, original image grid) -- the layout the SynthEcho tracking
# pipeline reads. Off by default: it roughly triples the output size.
save_rewards: False

common_spacing: [0.37, 0.37, 1]

apply_eq_hist: False

pin_memory: True

num_workers: 12

hydra:
  output_subdir: null
  run:
    dir: .
  job_logging:
    # Must stay false: true disables every logger that already exists when hydra configures
    # logging, which is all of them (module-level `log = get_pylogger(__name__)`), so the
    # script's own progress output vanishes. It is not what suppresses hydra.log -- that is
    # `output_subdir: null` above.
    disable_existing_loggers: false
  hydra_logging:
    disable_existing_loggers: true  # disables logging to hydra.log

model:
  tta: ${tta}
  tto: ${tto}
  # best parameters for TTO
  actor:
    actor_lr: 0.01
  divergence_coeff: 0.01
  entropy_coeff: 0.1
  inference: True

trainer:
  _target_: lightning.pytorch.Trainer
  inference_mode: False # MUST for TTO
  max_epochs: 1
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  logger: False

